<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate BookVocab Icons</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #818cf8;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>BookVocab Icon Generator</h1>
  <p>Generate PWA icons for BookVocab. Click the buttons below to download the required icons.</p>

  <div class="icon-preview">
    <div>
      <h3>192x192</h3>
      <canvas id="icon-192" width="192" height="192"></canvas>
      <br>
      <button onclick="downloadIcon('icon-192', 'icon-192.png')">Download 192x192</button>
    </div>
    <div>
      <h3>512x512</h3>
      <canvas id="icon-512" width="512" height="512"></canvas>
      <br>
      <button onclick="downloadIcon('icon-512', 'icon-512.png')">Download 512x512</button>
    </div>
    <div>
      <h3>512x512 Maskable</h3>
      <canvas id="icon-maskable" width="512" height="512"></canvas>
      <br>
      <button onclick="downloadIcon('icon-maskable', 'icon-maskable-512.png')">Download Maskable</button>
    </div>
  </div>

  <button onclick="downloadAll()">Download All Icons</button>

  <script>
    const primaryColor = '#6366f1';

    function drawBookIcon(ctx, size, isMaskable = false) {
      ctx.clearRect(0, 0, size, size);

      // Background
      ctx.fillStyle = primaryColor;
      ctx.fillRect(0, 0, size, size);

      // For maskable, draw background circle to ensure safe zone
      if (isMaskable) {
        ctx.fillStyle = primaryColor;
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Book icon (scaled for safe zone if maskable)
      const scale = isMaskable ? 0.5 : 0.6;
      const iconSize = size * scale;
      const offset = (size - iconSize) / 2;

      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = size * 0.04;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Draw open book
      const centerX = size / 2;
      const centerY = size / 2;
      const bookWidth = iconSize * 0.8;
      const bookHeight = iconSize * 0.6;

      // Left page
      ctx.beginPath();
      ctx.moveTo(centerX - bookWidth / 2, centerY - bookHeight / 2);
      ctx.lineTo(centerX, centerY - bookHeight / 2);
      ctx.lineTo(centerX, centerY + bookHeight / 2);
      ctx.bezierCurveTo(
        centerX - bookWidth / 6, centerY + bookHeight / 2,
        centerX - bookWidth / 6, centerY + bookHeight / 2,
        centerX - bookWidth / 2, centerY + bookHeight / 2
      );
      ctx.closePath();
      ctx.stroke();

      // Right page
      ctx.beginPath();
      ctx.moveTo(centerX + bookWidth / 2, centerY - bookHeight / 2);
      ctx.lineTo(centerX, centerY - bookHeight / 2);
      ctx.lineTo(centerX, centerY + bookHeight / 2);
      ctx.bezierCurveTo(
        centerX + bookWidth / 6, centerY + bookHeight / 2,
        centerX + bookWidth / 6, centerY + bookHeight / 2,
        centerX + bookWidth / 2, centerY + bookHeight / 2
      );
      ctx.closePath();
      ctx.stroke();

      // Page lines (left)
      for (let i = 1; i <= 3; i++) {
        const y = centerY - bookHeight / 2 + (bookHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(centerX - bookWidth / 2 + bookWidth * 0.1, y);
        ctx.lineTo(centerX - bookWidth * 0.05, y);
        ctx.stroke();
      }

      // Page lines (right)
      for (let i = 1; i <= 3; i++) {
        const y = centerY - bookHeight / 2 + (bookHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(centerX + bookWidth * 0.05, y);
        ctx.lineTo(centerX + bookWidth / 2 - bookWidth * 0.1, y);
        ctx.stroke();
      }
    }

    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      setTimeout(() => downloadIcon('icon-192', 'icon-192.png'), 100);
      setTimeout(() => downloadIcon('icon-512', 'icon-512.png'), 300);
      setTimeout(() => downloadIcon('icon-maskable', 'icon-maskable-512.png'), 500);
    }

    // Draw icons on load
    window.onload = function() {
      const canvas192 = document.getElementById('icon-192');
      const ctx192 = canvas192.getContext('2d');
      drawBookIcon(ctx192, 192, false);

      const canvas512 = document.getElementById('icon-512');
      const ctx512 = canvas512.getContext('2d');
      drawBookIcon(ctx512, 512, false);

      const canvasMaskable = document.getElementById('icon-maskable');
      const ctxMaskable = canvasMaskable.getContext('2d');
      drawBookIcon(ctxMaskable, 512, true);
    };
  </script>
</body>
</html>
